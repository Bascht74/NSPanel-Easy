#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page Confirm                                                                    #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_CONFIRM: nspanel.page.confirm

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_CONFIRM

ota:
  # The main loop is blocked while the OTA data is received, so the panel cannot react to touches.
  # Show a dialog when the display is awake, so the user knows an update is in progress.
  # The page name "tft_upload" is reused as it hides the dialog buttons and keeps the page when the API is offline.
  - id: !extend ota_std
    on_begin:
      then:
        - lambda: |-
            if (system_flags.tft_upload_active) return;  // TFT upload dialog is already shown
            if (current_page_id == get_page_id("screensaver")) {
              ESP_LOGD("${TAG_PAGE_CONFIRM}", "OTA started while sleeping - no dialog");
              return;
            }  // if (current_page_id == get_page_id("screensaver"))
            if (current_page_id == get_page_id("boot")) {
              disp1->send_command("tm_esphome.en=0");  // Stop updates from boot page
            }  // if (current_page_id == get_page_id("boot"))
            ESP_LOGD("${TAG_PAGE_CONFIRM}", "Open OTA dialog");
            disp1->set_component_text("confirm.page_name", "tft_upload");
            disp1->set_component_text("confirm.title", "NSPanel Easy");
            disp1->set_component_text("confirm.body", "Firmware update");
            goto_page->execute(get_page_id("confirm"));
    on_abort:
      then:
        - script.execute: ota_dialog_close
    on_error:
      then:
        - script.execute: ota_dialog_close

script:
  - id: ota_dialog_close  # Leaves the OTA dialog after a failed or aborted OTA
    mode: restart
    then:
      - lambda: |-
          if (system_flags.tft_upload_active) return;  // Dialog belongs to the TFT upload
          // The page change to confirm may still be queued, so current_page_id can still hold the page before the dialog
          const uint8_t return_page_id = (current_page_id == get_page_id("confirm")) ? last_page_id : current_page_id;
          if (return_page_id == get_page_id("screensaver")) return;  // Dialog was not shown
          ESP_LOGD("${TAG_PAGE_CONFIRM}", "Close OTA dialog");
          // Bypass goto_page, as it refuses a page that matches an outdated current_page_id
          disp1->goto_page(return_page_id);

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id == get_page_id("confirm"))
            page_confirm->execute();

  - id: page_confirm
    mode: single
    then:
      - lambda: |-
          if (current_page_id != get_page_id("confirm")) return;
          if (!is_device_ready_for_tasks()) return;
          if (system_flags.tft_upload_active) return;
          if (system_flags.ota_in_progress) return;
          disp1->set_component_text("confirm.title", wrapText(
                                                                "${LOCALIZATION[LANG].please_confirm}",
                                                                15,
                                                                ${LANG_BYTES_PER_CHAR}
                                                              ).c_str()
                                    );

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("confirm")) {
            display_entity_keep = true;
          }

  - id: !extend stop_page_constructors
    then:
      - lambda: page_confirm->stop();
...
