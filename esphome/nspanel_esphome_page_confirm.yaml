#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page Confirm                                                                    #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_CONFIRM: nspanel.page.confirm

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_CONFIRM

ota:
  # The main loop is blocked while the OTA data is received, so the panel cannot react to touches.
  # Show a dialog, also on the screensaver page, so the user knows an update is in progress.
  - id: !extend ota_std
    on_begin:
      then:
        - script.execute: ota_dialog_open
    on_progress:
      then:
        - script.execute:
            id: ota_dialog_progress
            progress: !lambda return x;
    on_abort:
      then:
        - script.execute: ota_dialog_close
    on_error:
      then:
        - script.execute: ota_dialog_close

script:
  - id: ota_dialog_open  # Shows the update dialog when an OTA begins
    mode: restart
    then:
      - lambda: |-
          if (system_flags.tft_upload_active) return;  // TFT upload dialog is already shown
          if (!disp1->is_setup()) return;  // No display to show the dialog
          // Also shown on the screensaver page: the confirm page restores the brightness, and the panel reboots
          // to the boot page after a successful OTA anyway
          ESP_LOGD("${TAG_PAGE_CONFIRM}", "Open OTA dialog");
          // Write directly to the UART: the Nextion component paces its commands from the main loop, which the OTA
          // blocks right after this, so queued commands would only be sent when the OTA ends.
          auto send_raw = [](const char *cmd) {
            static const uint8_t TERMINATOR[3] = {0xFF, 0xFF, 0xFF};
            tf_uart->write_str(cmd);
            tf_uart->write_array(TERMINATOR, sizeof(TERMINATOR));
          };
          send_raw("bkcmd=0");  // No replies, as these commands are not tracked by the Nextion component queue
          // The page name "tft_upload" hides the dialog buttons and keeps the page when the API is offline
          send_raw("confirm.page_name.txt=\"tft_upload\"");
          send_raw("confirm.title.txt=\"NSPanel Easy\"");
          send_raw("confirm.body.txt=\"Firmware update\\r0%\"");  // Progress updated by ota_dialog_progress
          // Sent even when confirm is the current page, so its Preinitialize event runs again and hides the buttons
          char page_cmd[12];
          snprintf(page_cmd, sizeof(page_cmd), "page %" PRIu8, get_page_id("confirm"));
          send_raw(page_cmd);
          // bkcmd=3 is restored by ota_dialog_close (or by the display setup after the reboot). Sent here, its reply
          // would reach the Nextion component after the OTA without a matching command and remove a queued one.
          tf_uart->flush();
          system_flags.ota_dialog_shown = true;

  - id: ota_dialog_progress  # Shows the OTA progress (%) in the dialog
    mode: restart
    parameters:
      progress: float  # Percentage reported by the OTA (0 to 100)
    then:
      - lambda: |-
          if (!system_flags.ota_dialog_shown) return;  // Dialog was not shown
          // Truncated, so 100% is only shown when all the data was received
          const uint8_t percent = static_cast<uint8_t>(std::clamp(progress, 0.0f, 100.0f));
          // Written directly to the UART, as in ota_dialog_open (the OTA blocks the main loop)
          static const uint8_t TERMINATOR[3] = {0xFF, 0xFF, 0xFF};
          char body_cmd[48];
          snprintf(body_cmd, sizeof(body_cmd), "confirm.body.txt=\"Firmware update\\r%" PRIu8 "%%\"", percent);
          tf_uart->write_str(body_cmd);
          tf_uart->write_array(TERMINATOR, sizeof(TERMINATOR));
          tf_uart->flush();

  - id: ota_dialog_close  # Leaves the OTA dialog after a failed or aborted OTA
    mode: restart
    then:
      - lambda: |-
          // Not set when the dialog was skipped (TFT upload or display not set up)
          if (!system_flags.ota_dialog_shown) return;
          system_flags.ota_dialog_shown = false;
          // The page change to confirm may still be queued, so current_page_id can still hold the page before the dialog
          const uint8_t return_page_id = (current_page_id == get_page_id("confirm")) ? last_page_id : current_page_id;
          ESP_LOGD("${TAG_PAGE_CONFIRM}", "Close OTA dialog");
          // Restore the reply level used by the Nextion component (ota_dialog_open set bkcmd=0).
          // Queued, so its reply is matched to a sent command and cannot remove the page change below.
          if (!disp1->send_command("bkcmd=3")) {
            // The component refuses commands while the display is sleeping, so write it directly
            static const uint8_t TERMINATOR[3] = {0xFF, 0xFF, 0xFF};
            tf_uart->write_str("bkcmd=3");
            tf_uart->write_array(TERMINATOR, sizeof(TERMINATOR));
          }  // if (!disp1->send_command("bkcmd=3"))
          // Bypass goto_page, as it refuses a page that matches an outdated current_page_id
          disp1->goto_page(return_page_id);

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id == get_page_id("confirm"))
            page_confirm->execute();

  - id: page_confirm
    mode: single
    then:
      - lambda: |-
          if (current_page_id != get_page_id("confirm")) return;
          if (!is_device_ready_for_tasks()) return;
          if (system_flags.tft_upload_active) return;
          if (system_flags.ota_in_progress) return;
          disp1->set_component_text("confirm.title", wrapText(
                                                                "${LOCALIZATION[LANG].please_confirm}",
                                                                15,
                                                                ${LANG_BYTES_PER_CHAR}
                                                              ).c_str()
                                    );

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("confirm")) {
            display_entity_keep = true;
          }

  - id: !extend stop_page_constructors
    then:
      - lambda: page_confirm->stop();
...
